kind: Relationship
version: v1
definition:
  name: Orders
  sourceType: Customer
  target:
    model:
      name: Orders
      relationshipType: Array
  mapping:
    - source:
        fieldPath:
          - fieldName: id
      target:
        modelField:
          - fieldName: customerId
