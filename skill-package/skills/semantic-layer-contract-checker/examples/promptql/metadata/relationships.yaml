kind: Relationship
version: v1
definition:
  name: Customer
  sourceType: Order
  target:
    model:
      name: Customers
      relationshipType: Object
  mapping:
    - source:
        fieldPath:
          - fieldName: customerId
      target:
        modelField:
          - fieldName: id
